# Render Blueprint for ZERO HOUR: BLACKOUT (game server + static web app).
# Nothing here is deployed automatically: connect the repo in Render and apply the blueprint.
services:
  # Authoritative game server (Colyseus over WebSocket). Run exactly ONE instance: rooms live in
  # process memory, so scaling out needs matchmaker/presence changes (see docs/DEPLOYMENT.md).
  - type: web
    name: zhb-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /ready
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Origin of the web app, e.g. https://zhb-web.onrender.com (comma-separate several).
      - key: CLIENT_ORIGINS
        sync: false
      # Render terminates TLS in front of us: trust X-Forwarded-For for per-IP limits.
      - key: TRUST_PROXY
        value: 'true'
      - key: METRICS_TOKEN
        generateValue: true
      - key: MAX_ROOMS
        value: '150'

  - type: web
    name: zhb-web
    runtime: static
    buildCommand: npm ci && npm run build -w @zhb/web
    staticPublishPath: apps/web/dist
    envVars:
      # Public URL of zhb-server, e.g. https://zhb-server.onrender.com (baked in at build time).
      - key: VITE_SERVER_URL
        sync: false
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https: wss:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      # Hashed assets never change: cache forever. index.html must always revalidate.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
